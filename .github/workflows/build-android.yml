name: Build Native Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21 (LTS)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses & Install Platform 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Install Client Dependencies
        run: |
          cd client
          npm install

      - name: Build Web Application
        run: |
          cd client
          npm run build

      - name: Sync Capacitor Android Project
        run: |
          cd client
          npx cap sync android

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          chmod +x client/android/gradlew

      - name: Build Android Debug APK
        run: |
          cd client/android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK with Official App Name
        run: |
          cp client/android/app/build/outputs/apk/debug/app-debug.apk client/android/app/build/outputs/apk/debug/AGY-Fit-v1.0.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AGY-Fit-v1.0-APK
          path: client/android/app/build/outputs/apk/debug/AGY-Fit-v1.0.apk
          retention-days: 14
