name: Build Native Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build, Version & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21 (LTS)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses & Install Platform 35
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Install Client Dependencies
        run: |
          cd client
          npm install

      - name: Extract Semantic Version
        id: get_version
        run: |
          APP_VER=$(node -p "require('./client/package.json').version || '1.1.0'")
          BUILD_NUM=${{ github.run_number }}
          RELEASE_TAG="v${APP_VER}-b${BUILD_NUM}"
          APK_BASENAME="AGY-Fit-v${APP_VER}-build${BUILD_NUM}.apk"
          echo "APP_VER=${APP_VER}" >> $GITHUB_ENV
          echo "BUILD_NUM=${BUILD_NUM}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV
          echo "APK_BASENAME=${APK_BASENAME}" >> $GITHUB_ENV
          echo "Version configured: ${RELEASE_TAG} -> ${APK_BASENAME}"

      - name: Build Web Application
        env:
          VITE_APP_VERSION: ${{ env.APP_VER }}
          VITE_BUILD_NUMBER: ${{ env.BUILD_NUM }}
          VITE_RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          cd client
          mkdir -p public
          echo "{\"version\":\"${{ env.APP_VER }}\",\"buildNumber\":\"${{ env.BUILD_NUM }}\",\"releaseTag\":\"${{ env.RELEASE_TAG }}\",\"apkBasename\":\"${{ env.APK_BASENAME }}\",\"publishedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > public/version.json
          npm run build

      - name: Sync Capacitor Android Project
        run: |
          cd client
          npx cap sync android

      - name: Grant Execute Permission to Gradle Wrapper
        run: |
          chmod +x client/android/gradlew

      - name: Build Android Debug APK
        run: |
          cd client/android
          ./gradlew assembleDebug -PversionCode=${{ env.BUILD_NUM }} -PversionName=${{ env.APP_VER }} --no-daemon --stacktrace

      - name: Package & Version APK Deliverables
        run: |
          mkdir -p dist-apk
          ORIG_APK="client/android/app/build/outputs/apk/debug/app-debug.apk"
          cp "$ORIG_APK" "dist-apk/${{ env.APK_BASENAME }}"
          cp "$ORIG_APK" "dist-apk/AGY-Fit-latest.apk"
          cp "$ORIG_APK" "dist-apk/AGY-Fit-release.apk"
          ls -la dist-apk/

      - name: Upload Versioned APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AGY-Fit-${{ env.RELEASE_TAG }}
          path: dist-apk/*
          retention-days: 30

      - name: Publish Automated GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "AGY Fit ${{ env.RELEASE_TAG }}"
          body: |
            ### Automated Build Release ${{ env.RELEASE_TAG }}
            - **App Version**: `${{ env.APP_VER }}`
            - **Build Number**: `${{ env.BUILD_NUM }}`
            - **Commit SHA**: `${{ github.sha }}`
            - **Build Timestamp**: `${{ github.event.head_commit.timestamp || 'Automated CI' }}`
            
            #### Assets
            - `${{ env.APK_BASENAME }}` (Version-tagged release)
            - `AGY-Fit-latest.apk` (Always points to this build)
          files: |
            dist-apk/${{ env.APK_BASENAME }}
            dist-apk/AGY-Fit-latest.apk
            dist-apk/AGY-Fit-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
